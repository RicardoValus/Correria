<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/notas" text="Voltar"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ editingId() ? 'Editar nota' : 'Nova nota' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <ion-item>
      <ion-input label="Título" labelPlacement="stacked" formControlName="titulo"></ion-input>
    </ion-item>
    <ion-item>
      <ion-textarea
        label="Conteúdo"
        labelPlacement="stacked"
        formControlName="corpo"
        [autoGrow]="true"
        rows="8"
        placeholder="Use **asteriscos** para negrito"
      ></ion-textarea>
    </ion-item>
    <ion-button fill="clear" type="button" (click)="wrapBold()">Inserir negrito</ion-button>
    <ion-item>
      <ion-toggle formControlName="fixada">Fixar nota</ion-toggle>
    </ion-item>
    <ion-item>
      <ion-toggle formControlName="favorita">Favorita</ion-toggle>
    </ion-item>
    <ion-button expand="block" type="submit" class="ion-margin-top">Salvar</ion-button>
  </form>
</ion-content>
