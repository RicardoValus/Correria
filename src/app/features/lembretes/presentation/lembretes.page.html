<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/mais" text="Voltar"></ion-back-button>
    </ion-buttons>
    <ion-title>Lembretes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="none">
    @for (item of lembretes(); track item.id) {
      <ion-item class="pulso-card reminder-item" lines="none">
        <ion-checkbox
          slot="start"
          [checked]="item.status === 'concluido'"
          (ionChange)="toggle(item.id)"
        ></ion-checkbox>
        <ion-label [routerLink]="['/lembrete', item.id]">
          <h3 [class.done]="item.status === 'concluido'">{{ item.titulo }}</h3>
          <p>{{ formatShortDate(item.dataHora) }} · {{ formatTime(item.dataHora) }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button color="primary" (click)="novo()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
